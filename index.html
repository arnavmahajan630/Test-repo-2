<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Pulse</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a0b2e 0%, #050505 100%);
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .orb {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, rgba(120, 0, 255, 0.6), rgba(0, 200, 255, 0.6));
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            filter: blur(40px);
            animation: morph 12s ease-in-out infinite, pulse 4s ease-in-out infinite;
            position: relative;
        }

        @keyframes morph {
            0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
            50% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 0.9; }
        }

        /* Ambient particles */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px);
            background-size: 550px 550px, 350px 350px;
            animation: drift 20s linear infinite;
        }

        @keyframes drift {
            from { background-position: 0 0, 0 0; }
            to { background-position: 550px 550px, 350px 350px; }
        }
    </style>
</head>
<body>
    <div class="particles"></div>
    <div class="container">
        <div class="orb"></div>
    </div>
</body>
</html>
