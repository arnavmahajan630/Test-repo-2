<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juicy Mango</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #1a1a1a;
            overflow: hidden;
        }

        .mango {
            width: 200px;
            height: 240px;
            background: radial-gradient(circle at 30% 30%, #ffdf40, #ff9d00, #d95300);
            border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
            position: relative;
            box-shadow: inset -20px -20px 50px rgba(0,0,0,0.2), 0 10px 30px rgba(0,0,0,0.3);
            transform: rotate(-10deg);
        }

        /* The "Juice" highlight */
        .mango::after {
            content: '';
            position: absolute;
            top: 20px;
            right: 40px;
            width: 40px;
            height: 80px;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            transform: rotate(20deg);
            filter: blur(5px);
        }

        /* Stem */
        .stem {
            position: absolute;
            top: -20px;
            left: 50%;
            width: 10px;
            height: 30px;
            background: #4a3424;
            border-radius: 5px;
            transform: rotate(-10deg);
        }
    </style>
</head>
<body>
    <div class="mango">
        <div class="stem"></div>
    </div>
</body>
</html>
