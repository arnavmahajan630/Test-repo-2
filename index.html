<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Animation</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #1a1a1a;
            overflow: hidden;
        }

        /* Kiwi Styles */
        .kiwi {
            width: 150px;
            height: 120px;
            background: #b58940;
            border-radius: 50% 50% 45% 45%;
            position: relative;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.3);
            animation: bounce 2s infinite ease-in-out;
        }
        .kiwi::before {
            content: '';
            position: absolute;
            top: 20%;
            left: 20%;
            right: 20%;
            bottom: 20%;
            background: #d4e09b;
            border-radius: 50%;
            border: 8px solid #f2f7dc;
        }
        .seeds {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .seed {
            position: absolute;
            background: #333;
            width: 6px;
            height: 10px;
            border-radius: 50%;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="kiwi">
        <div class="seeds">
            <div class="seed" style="top: 40%; left: 45%;"></div>
            <div class="seed" style="top: 55%; left: 50%;"></div>
            <div class="seed" style="top: 45%; left: 55%;"></div>
            <div class="seed" style="top: 60%; left: 40%;"></div>
        </div>
    </div>
</body>
</html>
